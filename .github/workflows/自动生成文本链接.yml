name: 自动生成文本链接

on:
  push:
    branches:
      - main
    paths:
      - 'tvbox/*.json'
      - 'tvbox/**/*.json'
      - 'apilinks.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 生成清单并检测链接
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["REPO"]
          sha = os.environ["SHA"]

          lines = [
              "# TVBox 接口地址清单",
              "",
              "本清单由 GitHub Actions 自动生成。",
              "",
              "连通性检测仅代表本次请求结果。",
              "",
              "# 一、仓库 JSON 文件",
              ""
          ]

          def check_url(url):
              try:
                  result = subprocess.run(
                      [
                          "curl",
                          "-L",
                          "--connect-timeout", "8",
                          "--max-time", "15",
                          "--silent",
                          "--show-error",
                          "--output", "/dev/null",
                          "--write-out", "%{http_code}",
                          "--range", "0-0",
                          url
                      ],
                      capture_output=True,
                      text=True,
                      timeout=20
                  )

                  code = result.stdout.strip()

                  if result.returncode != 0:
                      reason = result.stderr.strip()
                      if not reason:
                          reason = f"curl 错误 {result.returncode}"
                      return f"连接失败：{reason}"

                  if code.isdigit():
                      number = int(code)

                      if 200 <= number < 400:
                          return f"HTTP {code}（可访问）"

                      if number > 0:
                          return f"HTTP {code}（需检查）"

                  return "未获取到 HTTP 状态码"

              except subprocess.TimeoutExpired:
                  return "检测超时"
              except Exception as e:
                  return f"检测异常：{e}"

          files = sorted(Path("tvbox").rglob("*.json"))

          for p in files:
              name = p.relative_to("tvbox").as_posix()
              display_name = (
                  name[:-5] if name.endswith(".json") else name
              )

              # 直接使用中文文件名，不主动进行 URL 编码
              url = (
                  f"https://raw.githubusercontent.com/"
                  f"{repo}/{sha}/tvbox/{name}"
              )

              status = check_url(url)

              lines.extend([
                  f"## {display_name}：",
                  "",
                  url,
                  "",
                  f"检测结果：{status}",
                  ""
              ])

          lines.extend([
              "# 二、apilinks.txt 原始接口",
              "",
              "以下保留 apilinks.txt 中的原始链接。",
              ""
          ])

          apifile = Path("apilinks.txt")
          api_count = 0

          if apifile.exists():
              for raw_line in apifile.read_text(
                  encoding="utf-8-sig"
              ).splitlines():

                  line = raw_line.strip()

                  if not line or line.startswith("#"):
                      continue

                  parts = [item.strip() for item in line.split(",")]

                  if len(parts) < 2:
                      continue

                  name = parts[0]

                  urls = [
                      item for item in parts[1:]
                      if item.startswith(("http://", "https://"))
                  ]

                  if not urls:
                      continue

                  lines.extend([
                      f"## {name}：",
                      ""
                  ])

                  for url in urls:
                      status = check_url(url)

                      lines.extend([
                          url,
                          f"检测结果：{status}",
                          ""
                      ])

                      api_count += 1
          else:
              lines.extend([
                  "未找到 apilinks.txt。",
                  ""
              ])

          Path("release-notes.md").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print(f"JSON 文件数量：{len(files)}")
          print(f"apilinks.txt 链接数量：{api_count}")

          if not files and api_count == 0:
              raise SystemExit("没有找到可生成的接口")

          PY

      - name: 创建 Tag 和 Release 说明
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="接口清单-$(date -u +'%Y%m%d-%H%M%S')"

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "TVBox 接口清单 $TAG" \
            --notes-file release-notes.md
