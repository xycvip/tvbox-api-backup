name: 同步 api_list.json 配置

on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/自动同步上游apilinks.yml"
      - "python/上游源检测.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装检测依赖
        run: pip install requests

      - name: 下载上游 api_list.json
        run: |
          set -euo pipefail
          SOURCE_URL="https://raw.githubusercontent.com/lubin776/tvbox-api-backup/main/api_list.json"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            "$SOURCE_URL" --output api_list.upstream.json

          if [ ! -s api_list.upstream.json ] || ! grep -q '[^[:space:]]' api_list.upstream.json; then
            echo "::error::上游文件为空或无有效内容，取消同步"
            exit 1
          fi
          echo "上游配置下载成功"

      - name: 逐条检测上游源并过滤失效源
        id: probe
        run: |
          set -euo pipefail
          python python/上游源检测.py \
            --upstream api_list.upstream.json \
            --local api_list.json \
            --output api_list.filtered.json \
            --report upstream-source-check.txt

          cat upstream-source-check.txt >> "$GITHUB_STEP_SUMMARY"
          cp api_list.filtered.json api_list.json

      - name: 检查内容变化
        id: changes
        run: |
          if git diff --quiet -- api_list.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "过滤后配置没有变化，不需要提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- api_list.json
          fi

      - name: 提交并推送
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- api_list.json
          git commit -m "chore: 检测后同步上游 api_list.json"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 触发自动生成文本链接
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "自动生成文本链接.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "已触发自动生成文本链接"

      - name: 同步结果
        if: steps.changes.outputs.changed == 'false'
        run: echo "检测完成，过滤后的配置与本地一致，无需同步"
