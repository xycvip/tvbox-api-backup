
name: 同步 apilinks 配置

on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载上游 apilinks.txt
        run: |
          set -euo pipefail

          SOURCE_URL="https://raw.githubusercontent.com/lubin776/tvbox-api-backup/main/apilinks.txt"
          TEMP_FILE="$(mktemp)"
          trap 'rm -f "$TEMP_FILE"' EXIT

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            "$SOURCE_URL" \
            --output "$TEMP_FILE"

          if [ ! -s "$TEMP_FILE" ] ||
             ! grep -q '[^[:space:]]' "$TEMP_FILE"; then
            echo "::error::上游文件为空或无有效内容，取消同步"
            exit 1
          fi

          cp "$TEMP_FILE" apilinks.txt
          echo "上游文件下载成功"

      - name: 检查内容变化
        id: changes
        run: |
          if git diff --quiet -- apilinks.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "文件没有变化，不重复生成链接"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- apilinks.txt
          fi

      - name: 提交并推送
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- apilinks.txt
          git commit -m "chore: 同步上游 apilinks.txt"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: 触发自动生成文本链接
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "自动生成文本链接.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          echo "已触发自动生成文本链接"

      - name: 同步结果
        run: echo "同步流程结束"
